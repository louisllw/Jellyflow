# Jellyflow — run your own instance in one command:
#
#   docker compose up -d
#
# then open http://localhost:8080 and sign in to your Jellyfin server.
#
# To pin this deployment to one server, set JELLYFIN_URL:
#
#   JELLYFIN_URL=https://jellyfin.example.org docker compose up -d

services:
  jellyflow:
    image: ghcr.io/louisllw/jellyflow:latest
    container_name: jellyflow
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - JELLYFIN_URL=${JELLYFIN_URL:-}
    restart: unless-stopped
