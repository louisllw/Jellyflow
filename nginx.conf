server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http: https:; media-src 'self' blob: http: https:; connect-src 'self' blob: http: https: ws: wss:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  # Generated at container startup when JELLYFIN_URL is set. Keeping the
  # upstream server-side lets Docker-only hostnames work without exposing
  # them to the visitor's browser.
  include /etc/nginx/jellyfin-proxy.conf;

  location = /env-config.js {
    expires epoch;
    try_files $uri =404;
  }

  # Long-lived cache for fingerprinted build assets
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA fallback: every non-asset route serves the app shell
  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
